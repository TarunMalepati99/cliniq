name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cliniq, POSTGRES_PASSWORD: cliniq, POSTGRES_DB: cliniq }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cliniq" --health-interval 5s --health-retries 20
    env:
      CLINIQ_ENV: dev
      CLINIQ_DATABASE_URL: postgresql://cliniq:cliniq@localhost:5432/cliniq
      CLINIQ_TEST_DATABASE_URL: postgresql://cliniq:cliniq@localhost:5432/cliniq_test
      CLINIQ_READER_DATABASE_URL: postgresql://cliniq_reader:cliniq_reader@localhost:5432/cliniq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dbt,dev]"
      - run: PGPASSWORD=cliniq psql -h localhost -U cliniq -d cliniq -c "CREATE DATABASE cliniq_test"
      - name: Lint
        run: ruff check backend/cliniq
      - name: Unit, integration and benchmark-regression tests
        run: cd backend && pytest -q --cov=cliniq --cov-report=term
      - name: Full pipeline (migrate, generate, ingest, dbt build + tests, index)
        run: cliniq bootstrap
      - name: Benchmark run (artifacts)
        run: cliniq eval
      - uses: actions/upload-artifact@v4
        with: { name: eval-reports, path: eval/reports/ }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run typecheck && npm run build
