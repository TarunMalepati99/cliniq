# Local, no-cloud deployment: PostgreSQL + API (FastAPI, runs the bootstrap pipeline) + web (Next.js).
# Copy .env.example to .env first. NOTE: this file was written but not executed in the
# environment where CLINIQ was built (no Docker daemon there); see docs/limitations.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cliniq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cliniq
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cliniq} -d cliniq"]
      interval: 5s
      retries: 20
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      CLINIQ_ENV: ${CLINIQ_ENV:-dev}
      CLINIQ_DATABASE_URL: postgresql://${POSTGRES_USER:-cliniq}:${POSTGRES_PASSWORD}@db:5432/cliniq
      CLINIQ_READER_DATABASE_URL: postgresql://cliniq_reader:${CLINIQ_READER_PASSWORD:?set CLINIQ_READER_PASSWORD in .env}@db:5432/cliniq
      CLINIQ_READER_PASSWORD: ${CLINIQ_READER_PASSWORD}
      CLINIQ_API_TOKENS: ${CLINIQ_API_TOKENS:-}
      CLINIQ_REQUIRE_DISTINCT_APPROVER: ${CLINIQ_REQUIRE_DISTINCT_APPROVER:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: [cliniq-data:/app/data/synthetic, cliniq-uploads:/app/data/uploads, cliniq-reports:/app/eval/reports]
    ports: ["8000:8000"]
  web:
    build: { context: ./frontend, args: { CLINIQ_API_URL: "http://api:8000" } }
    environment: { CLINIQ_API_URL: "http://api:8000" }
    depends_on: [api]
    ports: ["3000:3000"]
volumes: { pgdata: {}, cliniq-data: {}, cliniq-uploads: {}, cliniq-reports: {} }
