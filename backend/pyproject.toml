[project]
name = "cliniq"
version = "0.1.0"
description = "CLINIQ — Clinical Intelligence & Cohort Feasibility Platform (research prototype)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "psycopg[binary]>=3.2",
  "sqlglot>=25", "rank-bm25>=0.2.2", "scikit-learn>=1.4", "numpy>=1.26", "python-multipart>=0.0.9",
]
[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dbt = ["dbt-core>=1.10,<2", "dbt-postgres>=1.9"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]
[project.scripts]
cliniq = "cliniq.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["cliniq*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 140
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "SIM108"]   # SIM108: if/else kept for readability; B008: FastAPI's Depends()/Query() default-argument idiom
